# Publie le site sur GitHub Pages avec le nombre de téléchargements à jour (voir README).
# Le total est inscrit dans les pages au moment de la publication : le visiteur ne charge rien
# d'autre que le site.
name: Site

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 5 * * *' # chaque jour à 5 h 17 UTC
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Dossier publié
        run: |
          mkdir _site
          cp -R index.html mentions-legales.html en assets _site/

      - name: Nombre de téléchargements
        env:
          GITHUB_TOKEN: ${{ github.token }}
        # En cas d'échec (API indisponible), les pages gardent le dernier chiffre enregistré.
        run: node scripts/downloads.mjs _site || echo "::warning::Compteur non mis à jour, dernier chiffre conservé."

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v5
